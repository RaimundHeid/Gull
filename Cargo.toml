[package]
name = "gull"
version = "0.1.0"
edition = "2021"
description = "Rust port of the Gull chess engine (Lazy SMP, Syzygy tablebases)"
license = "MIT"

[[bin]]
name = "gull"
path = "src/bin/gull.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
opt-level = 2

[dependencies]
pyrrhic-rs = "0.2.0"
